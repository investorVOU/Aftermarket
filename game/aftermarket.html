<style>

.ph-ctl{position:absolute;top:-48px;left:0;right:0;display:flex;justify-content:space-between;gap:8px}.ph-ctl button{min-width:76px;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid #d2d1bf55;background:#202e29;color:#f3eadc;font:600 12px system-ui;cursor:pointer;box-shadow:0 2px 8px #0005}

.ph-body:before,.ph-body:after{content:"";position:absolute;left:-3px;width:3px;border-radius:2px;background:#3a3f3d}.ph-body:before{top:110px;height:44px}.ph-body:after{top:170px;height:44px}
.ph-screen{position:relative;width:100%;height:100%;border-radius:41px;overflow:hidden;background:#0f2a1c;color:#fff}.ph-screen.light .ph-status{color:#17201b}

.ph-status span:last-child{display:flex;gap:5px;align-items:center}.ph-status small{font-size:11px;font-weight:600}.bat{display:inline-block;width:26px;height:12px;border:1.5px solid currentColor;border-radius:4px;padding:1px;opacity:.9;box-sizing:border-box;position:relative;font-style:normal}.bat s{display:block;height:100%;background:currentColor;border-radius:1.5px;width:16px}
.ph-home{position:absolute;inset:0;padding:58px 16px 0;background:radial-gradient(120% 60% at 20% 0,#2f7a4d 0,transparent 60%),radial-gradient(90% 50% at 90% 30%,rgba(201,242,90,.25),transparent 60%),linear-gradient(170deg,#1f5a3a,#0c2417 75%);transition:transform .38s cubic-bezier(.22,1,.36,1),opacity .3s,filter .3s}
.ph-home.back{transform:scale(.92);opacity:.5;filter:blur(1px)}
.wgt{border-radius:22px;padding:12px 14px 12px;background:rgba(255,255,255,.16);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);margin-bottom:20px;position:relative;box-shadow:0 1px 0 rgba(255,255,255,.18) inset}.wgt .lbl{position:absolute;top:12px;right:14px;font-size:11px;opacity:.75}.wgt b{display:block;font-size:30px;font-weight:700;letter-spacing:-.5px;color:#f2f7e8}.wgt em{font-style:normal;font-size:12px;opacity:.85;display:block}.wgt small{font-size:11px;opacity:.7}

.dock{position:absolute;left:12px;right:12px;bottom:28px;height:80px;border-radius:28px;background:rgba(255,255,255,.18);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;justify-content:space-around;align-items:center}.dock .ico span{display:none}

.ph-nav{display:flex;align-items:center;padding:48px 10px 8px;background:rgba(241,244,236,.94);border-bottom:.5px solid #d3d9cb}.ph-nav .bk{border:0;background:none;color:#1f6b43;font-size:16px;min-width:76px;text-align:left;cursor:pointer;padding:6px 2px}.ph-nav .tt{flex:1;text-align:center;font-weight:700;font-size:16px}.ph-nav .sp{min-width:76px}

.hero{text-align:center;padding:18px 8px 16px;background:linear-gradient(160deg,#1f5a3a,#143324);border-radius:18px;margin-bottom:12px;color:#f2f7e8}.hero small{opacity:.8}.hero b{display:block;font-size:38px;letter-spacing:-1px;margin:4px 0}.hero span{font-size:11.5px;opacity:.75}

</style></head><body>
<div class="hud" id="hud"></div><div class="log" id="log"></div><div class="panel" id="panel" style="display:none"></div><div class="tip" id="tip" style="display:none"></div>
<div class="help">WASD/arrows move · Q/E or drag rotate · wheel zoom · Shift-drag pan · C recenter · T follow nearest NPC (or click one) · F interact · G contract · Esc close</div>
<link rel="stylesheet" href="/shell.css">
<script src="/vendor/three.min.js"></script>
<script src="/shared/core.js"></script>
<script src="/shared/state.js"></script>
<script>
const Game=Aftermarket.createGame();const {Bus,Eco,Sim,MS,Biz,money:$}=Game;
const Net={enabled:typeof location!=='undefined',online:false,blocked:true,movement:{x:0,z:0},command:()=>Promise.resolve()};
// A fixed world seed keeps server collision data and the rendered island identical.
const Math=Object.create(globalThis.Math);Math.random=Aftermarket.seededRandom(12345);
const Districts={settlement:{loaded:true,bounds:[-90,90]},harbour:{loaded:true},residential:{loaded:true},goldmine:{loaded:true},market:{loaded:false},load(id){const d=this[id];if(d&&!d.loaded)Eco.say('District "'+id+'" not built yet.');}}; // future districts register here
const UI={open:null,tab:'ov',
 close(){this.open=null;panel.style.display='none';},
 sync(){this.open=Eco.post.owner?'manage':'sale';this.render();},
 showFarm(){this.open='farm';this.render();},
 renderFarm(){const F=Eco.farm,A=Sim.Agri,P=Eco.player,AGP=Eco.AGP;this.ftab=this.ftab||'ov';panel.style.display='block';
  const T=(k,n)=>`<button class="${this.ftab===k?'on':''}" onclick="UI.ftab='${k}';UI.render()">${n}</button>`;
  let h=`<h3>${F.name}</h3>${T('ov','Overview')}${T('goods','Goods')}${T('crops','Crops')}${T('live','Livestock')}${T('hist','History')}<hr style="opacity:.2">`;
  const tr=Sim.tractor,trs=tr.state==='idle'?'parked':tr.state==='act'?'working':tr.field?'in a field':'on the road';
  if(this.ftab==='ov')h+=`<p>Status: <b>${F.activity}</b> · Cash <b>${$(F.cash)}</b></p><p>Revenue ${$(F.rev)} · Expenses ${$(F.exp)} · Net ${$(F.rev-F.exp)}</p><p>Barn: 🌽${F.inv.maize}/${F.cap.maize} · 🍠${F.inv.cassava}/${F.cap.cassava} · 🥛${F.inv.milk}/${F.cap.milk}</p><p>Tractor: ${trs}${tr.cargo?' · carrying '+tr.cargo.q+' '+tr.cargo.item:''} · last delivery: ${A.last}</p><p>Market stock: 🌽${Eco.market.inv.maize} 🍠${Eco.market.inv.cassava} 🥛${Eco.market.inv.milk}</p>`;
